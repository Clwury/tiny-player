[package]
name = "tiny-player"
version = "0.1.0"
edition = "2024"
description = "Native Emby desktop client with FFmpeg and Vulkan playback"
license = "MIT"
homepage = "https://github.com/Clwury/tiny-player"
repository = "https://github.com/Clwury/tiny-player"

[dependencies]
anyhow = "1.0"
directories = "5"
cpal = "0.17.3"
dolby_vision = { git = "https://github.com/quietvoid/dovi_tool", tag = "libdovi-3.4.0", package = "dolby_vision" }
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["wayland", "x11"] }
ffmpeg-sys-next = { version = "9.0", default-features = false, features = ["avformat", "swscale", "swresample"] }
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11.1"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.12"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["test-support"] }
tempfile = "3.13"

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3.33"
