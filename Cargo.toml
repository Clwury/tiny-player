[package]
name = "tiny-player"
version = "0.1.0"
edition = "2024"
description = "Native Emby desktop client with FFmpeg and Vulkan playback"
license = "MIT"
homepage = "https://github.com/Clwury/tiny-player"
repository = "https://github.com/Clwury/tiny-player"

[dependencies]
anyhow = "1.0"
directories = "5"
cpal = "0.17.3"
dolby_vision = { git = "https://github.com/quietvoid/dovi_tool", package = "dolby_vision" }
gpui = "0.2.2"
ffmpeg-sys-next = { version = "8.1", default-features = false, features = ["avformat", "swscale", "swresample"] }
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.12"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.13"

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

[patch.crates-io]
# proc-macro-error2 2.0.1 re-exports a private proc_macro crate, which is a
# future hard error in Rust. Keep the upstream source with the compiler's
# suggested one-line visibility fix until crates.io publishes a fixed release.
proc-macro-error2 = { path = "vendor/proc-macro-error2" }
